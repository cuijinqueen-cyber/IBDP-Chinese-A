  <style>
    :root {
      --ink: #13261f;
      --ink-soft: #3d5349;
      --brand: #1a5c45;
      --brand-deep: #0f3d2e;
      --accent: #d97706;
      --mist: #dce8e2;
      --fog: #eef4f0;
      --line: #c5d4cc;
      --surface: rgba(255,255,255,.72);
      --surface-strong: rgba(255,255,255,.92);

    * { box-sizing: border-box; }
    body {

    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(100% - 2rem, var(--max)); margin: 0 auto; padding: 1.25rem 0 5.5rem; }

    .band-chip strong { color: var(--brand); }
    .nav { position:fixed; left:50%; bottom:1rem; transform:translateX(-50%); z-index:40; display:flex; gap:.35rem; padding:.4rem; background:rgba(255,255,255,.88); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:999px; box-shadow:var(--shadow); }

    .nav button.active { background:var(--brand); color:#f7faf8; }
    @media (min-width:840px) {
      .nav { position:static; transform:none; margin-left:auto; }

      .hero { grid-template-columns:1.2fr .8fr; align-items:end; min-height:42vh; }

    .hero { display:grid; gap:1.25rem; margin-bottom:2rem; animation: rise .85s .05s ease both; }

    .hero p { margin:0; max-width:34ch; font-size:1.05rem; line-height:1.55; color:var(--ink-soft); }
    .hero-cta { display:flex; flex-wrap:wrap; gap:.7rem; margin-top:1.35rem; }

    .btn-primary { background:var(--brand); color:#f7faf8; box-shadow:0 10px 24px rgba(26,92,69,.25); }
    .btn-secondary { background:var(--surface-strong); border-color:var(--line); color:var(--ink); }

    .streak-row { display:flex; gap:.75rem; margin-top:1.25rem; }

    .section { margin-top:2rem; animation: fade .7s ease both; }
    .section-head { margin-bottom:.9rem; }

    .section-head p { margin:.25rem 0 0; color:var(--ink-soft); font-size:.95rem; }
    .checklist, .feedback-grid, .vocab-grid, .progress-stats { display:grid; gap:.75rem; }
    .check-item { display:flex; align-items:flex-start; gap:.85rem; padding:1rem 1.1rem; background:var(--surface); border:1px solid var(--line); border-radius:18px; text-align:left; width:100%; color:inherit; }
    .check-item.done { border-color:rgba(26,92,69,.35); background:rgba(26,92,69,.06); }
    .check-dot { width:1.35rem; height:1.35rem; border-radius:50%; border:2px solid var(--line); flex-shrink:0; display:grid; place-items:center; font-size:.75rem; color:transparent; margin-top:.1rem; }
    .check-item.done .check-dot { background:var(--brand); border-color:var(--brand); color:#fff; }
    .check-item h3 { margin:0 0 .2rem; font-size:1rem; }
    .check-item p { margin:0; color:var(--ink-soft); font-size:.88rem; }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:1.15rem 1.2rem; }
    .panel + .panel { margin-top:.9rem; }
    .prompt-box { margin:.85rem 0; padding:1rem 1.1rem; border-left:3px solid var(--brand); background:rgba(26,92,69,.05); border-radius:0 14px 14px 0; white-space:pre-wrap; line-height:1.55; }
    .tip, .muted { color:var(--ink-soft); font-size:.9rem; line-height:1.45; }

    .vocab-tag { display:inline-flex; align-items:center; gap:.35rem; padding:.4rem .75rem; border-radius:999px; background:rgba(217,119,6,.12); color:#9a4e06; font-size:.84rem; font-weight:600; border:1px solid rgba(217,119,6,.22); animation: pulse 2.8s ease-in-out infinite; }
    .vocab-tag.col { background:rgba(26,92,69,.1); color:var(--brand-deep); border-color:rgba(26,92,69,.22); }
    .vocab-tag .mark { font-size:.7rem; opacity:.75; font-weight:500; }
    .part-tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; }
    .part-tabs button { border:1px solid var(--line); background:var(--surface-strong); border-radius:999px; padding:.45rem .9rem; color:var(--ink-soft); font-weight:500; }
    .part-tabs button.active { background:var(--brand-deep); border-color:var(--brand-deep); color:#f4faf7; }
    .part-tabs button.done:not(.active) { border-color:rgba(26,92,69,.4); color:var(--brand); }
    .recorder { display:grid; gap:.9rem; margin-top:1.1rem; }
    .recorder-status { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .timer { font-family:var(--font-display); font-size:2.4rem; line-height:1; color:var(--brand-deep); }
    .rec-indicator { display:inline-flex; align-items:center; gap:.45rem; color:var(--danger); font-weight:600; font-size:.9rem; }
    .rec-indicator i { width:.55rem; height:.55rem; border-radius:50%; background:var(--danger); animation: blink 1s ease infinite; }
    .recorder-actions { display:flex; flex-wrap:wrap; gap:.6rem; }
    audio { width:100%; }
    .note-input { width:100%; min-height:72px; resize:vertical; border:1px solid var(--line); border-radius:14px; padding:.75rem .9rem; background:#fff; margin-top:.45rem; }
    .criterion { padding:.9rem 1rem; border-radius:16px; background:var(--fog); border:1px solid var(--line); }
    .criterion-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.35rem; }
    .criterion-top strong { font-size:1.15rem; color:var(--brand); }
    .criterion p { margin:.25rem 0 0; font-size:.88rem; color:var(--ink-soft); }
    .upgrade-list, .phrase-list { margin:.6rem 0 0; padding-left:1.1rem; color:var(--ink-soft); line-height:1.5; }
    .phrase-list strong { color:var(--brand-deep); }
    .vocab-card { padding:1rem 1.1rem; border-radius:18px; background:var(--surface); border:1px solid var(--line); }
    .vocab-card.mastered { border-color:rgba(26,92,69,.4); background:rgba(26,92,69,.05); }
    .vocab-card .phrase { font-family:var(--font-display); font-size:1.35rem; color:var(--brand-deep); margin:0 0 .35rem; }
    .vocab-card .meaning { margin:0; color:var(--ink-soft); font-size:.9rem; }
    .vocab-card .example { margin:.7rem 0 0; padding:.7rem .8rem; border-radius:12px; background:rgba(26,92,69,.06); font-size:.92rem; line-height:1.45; }
    .vocab-card mark { background:rgba(217,119,6,.22); color:var(--ink); padding:0 .15rem; border-radius:3px; }
    .vocab-meta { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.75rem; align-items:center; }
    .mini-tag { font-size:.72rem; padding:.2rem .5rem; border-radius:999px; background:var(--fog); color:var(--ink-soft); border:1px solid var(--line); }
    .drill-actions { display:flex; gap:.45rem; margin-left:auto; flex-wrap:wrap; }
    .drill-actions button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:.35rem .7rem; font-size:.8rem; font-weight:600; color:var(--ink-soft); }
    .drill-actions .know { color:var(--ok); border-color:rgba(21,122,75,.35); }
    .stat { padding:1rem; border-radius:18px; background:var(--surface); border:1px solid var(--line); }
    .stat .num { font-family:var(--font-display); font-size:2rem; color:var(--brand-deep); line-height:1; }
    .stat .lbl { margin-top:.35rem; font-size:.82rem; color:var(--ink-soft); }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem; margin-top:1rem; }
    .day-cell { aspect-ratio:1; border-radius:10px; background:rgba(255,255,255,.55); border:1px solid var(--line); display:grid; place-items:center; font-size:.75rem; color:var(--ink-soft); }
    .day-cell.partial { background:rgba(217,119,6,.15); border-color:rgba(217,119,6,.3); color:#9a4e06; }
    .day-cell.full { background:rgba(26,92,69,.18); border-color:rgba(26,92,69,.35); color:var(--brand-deep); font-weight:600; }
    .day-cell.today { outline:2px solid var(--brand); outline-offset:1px; }
    .prep-banner { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.8rem 1rem; border-radius:14px; background:rgba(217,119,6,.12); border:1px solid rgba(217,119,6,.25); margin-bottom:.9rem; }
    .prep-banner strong { font-family:var(--font-display); font-size:1.6rem; color:#9a4e06; }
    .hidden { display:none !important; }
    @keyframes rise { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:none;} }
    @keyframes fade { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.03);} }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
</head>
<body>
  <div class="shell">

<script>

const CRITERION_LABELS = { fluency:'流利连贯', lexical:'词汇资源', grammar:'语法多样性', pronunciation:'发音' };

const VOCAB = [
  {id:'v1',phrase:'a steep learning curve',meaning:'陡峭的学习曲线',example:'Teaching myself coding has been a steep learning curve.',topic:'Education',type:'collocation'},

  {id:'v18',phrase:'environmental footprint',meaning:'环境足迹',example:'Cycling reduces my environmental footprint.',topic:'Environment',type:'topic'},
  {id:'v19',phrase:'go the extra mile',meaning:'多付出努力',example:'Good teachers go the extra mile for their students.',topic:'Education',type:'collocation'},
  {id:'v20',phrase:'a household name',meaning:'家喻户晓',example:'That brand has become a household name.',topic:'Media',type:'collocation'},
  {id:'v21',phrase:'quality time',meaning:'高质量陪伴时间',example:'I cherish quality time with my family.',topic:'Family',type:'topic'},
  {id:'v22',phrase:'break the ice',meaning:'打破僵局',example:'A shared joke can break the ice.',topic:'People',type:'collocation'},
  {id:'v23',phrase:'sustainable lifestyle',meaning:'可持续生活方式',example:'More young people adopt a sustainable lifestyle.',topic:'Environment',type:'topic'},
  {id:'v24',phrase:'think outside the box',meaning:'跳出思维定式',example:'Creative jobs require you to think outside the box.',topic:'Work',type:'collocation'},
];

const MOCKS = [
  {id:'m0',topic:'Hometown & Daily Life',topicZh:'家乡与日常生活',highlights:['a tight-knit community','strike a balance between','quality time','recharge my batteries'],
    parts:[
      {id:'p1',label:'Part 1',prompt:'Where is your hometown? What do you like most about living there? Has it changed much in recent years?',tips:'用具体细节回答，避免只说 “it’s nice”。',speak:90,focus:['v15','v4','v21']},
      {id:'p2',label:'Part 2',prompt:'Describe a place in your hometown that you often visit.\nYou should say:\n• where it is\n• how often you go there\n• what you do there\nand explain why this place is special to you.',tips:'1 分钟准备，说满 1.5–2 分钟。',prep:60,speak:120,focus:['v15','v16','v21']},
      {id:'p3',label:'Part 3',prompt:'Do you think people today spend enough quality time with their neighbours? How can cities help build stronger communities?',tips:'先给立场，再举例，最后给建议。',speak:120,focus:['v8','v15','v13']},

  {id:'m1',topic:'Education & Learning',topicZh:'教育与学习',highlights:['a steep learning curve','hands-on experience','go the extra mile','play a pivotal role'],
    parts:[
      {id:'p1',label:'Part 1',prompt:'What subjects did you enjoy at school? Do you prefer studying alone or in a group? How do you usually learn new skills?',tips:'过去时谈学校，现在时谈习惯。',speak:90,focus:['v1','v9','v19']},
      {id:'p2',label:'Part 2',prompt:'Describe a skill you learned that was difficult at first.\nYou should say:\n• what the skill was\n• how you learned it\n• what challenges you faced\nand explain how you feel about this skill now.',tips:'困难 → 坚持 → 突破。',prep:60,speak:120,focus:['v1','v9','v19']},

  {id:'m2',topic:'Technology & Media',topicZh:'科技与媒体',highlights:['a double-edged sword','keep abreast of','shed light on','a household name'],

      {id:'p2',label:'Part 2',prompt:'Describe a useful app or website you often use.\nYou should say:\n• what it is\n• how you use it\n• how often you use it\nand explain why you find it useful.',tips:'具体场景 > 抽象优点。',prep:60,speak:120,focus:['v14','v3','v20']},

  {id:'m5',topic:'Travel & Culture',topicZh:'旅行与文化',highlights:['broaden my horizons','cultural immersion','break the ice','food for thought'],

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterdayKey() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function byId(ids){ return ids.map(id => VOCAB.find(v=>v.id===id)).filter(Boolean); }
function byPhrase(p){ return VOCAB.find(v=>v.phrase.toLowerCase()===p.toLowerCase()); }
function clamp(n){ return Math.round(Math.min(7.5, Math.max(6,n))*2)/2; }
function fmt(sec){ return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function isComplete(c){ return c.recorded && c.mockDone && c.vocabDrilled && c.feedbackSeen; }

function defaultState(){
  return {
    currentBand:6.5, targetBand:7, streak:0, longestStreak:0, dayCursor:0,
    checkIns:[], recordings:[], lastFeedback:null, lastFeedbackDate:null,
    vocabProgress: Object.fromEntries(VOCAB.map(v=>[v.id,{id:v.id,reps:0,mastered:false}])),
  };
}
function load(){ try{ return {...defaultState(), ...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}; }catch{ return defaultState(); } }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let partIndex = 0;
let doneParts = [];
let prepLeft = null;
let prepTimer = null;
let noted = '';
let report = state.lastFeedbackDate === todayKey() ? state.lastFeedback : null;
let rec = { status:'idle', sec:0, url:null, media:null, chunks:[], timer:null, stream:null };
let vocabFilter = 'today';

function todayCheckIn(){
  return state.checkIns.find(c=>c.date===todayKey()) || {date:todayKey(),recorded:false,mockDone:false,vocabDrilled:false,feedbackSeen:false};
}
function upsertCheckIn(patch){
  const today = todayKey();
  const existing = state.checkIns.find(c=>c.date===today);
  const next = {date:today,recorded:false,mockDone:false,vocabDrilled:false,feedbackSeen:false,...existing,...patch};
  const others = state.checkIns.filter(c=>c.date!==today);
  if (isComplete(next) && (!existing || !isComplete(existing))) {
    const y = yesterdayKey();
    const hadY = state.checkIns.some(c=>c.date===y && isComplete(c));
    state.streak = hadY ? state.streak + 1 : 1;
    state.longestStreak = Math.max(state.longestStreak, state.streak);
    state.dayCursor += 1;
  }
  state.checkIns = [...others, next].sort((a,b)=>a.date.localeCompare(b.date));
  const full = state.checkIns.filter(isComplete).length;
  state.currentBand = Math.min(7, Math.round((6.5 + Math.min(full,20)*0.025)*2)/2);
  save();
}
function mock(){ return MOCKS[state.dayCursor % MOCKS.length]; }

function generateFeedback(durationSec, focus, notedPhrases, partLabel){
  const notedLower = notedPhrases.map(p=>p.toLowerCase());
  const used = focus.filter(v => notedLower.some(n => n.includes(v.phrase.toLowerCase()) || v.phrase.toLowerCase().includes(n)));
  const missed = focus.filter(v => !used.includes(v));
  let base = 6.5;
  if (durationSec >= 45) base += 0.1;
  if (durationSec >= 80) base += 0.1;
  if (durationSec < 25) base -= 0.3;
  if (used.length >= Math.min(2, focus.length)) base += 0.2;
  else if (used.length === 0 && focus.length) base -= 0.15;
  base = clamp(base);
  const criteria = [
    {criterion:'fluency', score:clamp(base+(durationSec>=60?0.1:-0.1)), note:durationSec>=60?`${partLabel} 时长充足，流畅度接近 7 分。`:`${partLabel} 回答偏短，请扩展细节。`, tip:'减少自我修正，用 however / for instance 串意群。'},
    {criterion:'lexical', score:clamp(base+(used.length?0.2:-0.15)), note:used.length?`已尝试：${used.map(u=>u.phrase).join('、')}`:'今日重点搭配几乎未出现，这是 6.5→7 的关键差距。', tip:'用精准搭配替换 good/important。'},
    {criterion:'grammar', score:clamp(base), note:'混合简单句与复杂句；Part 3 多用从句/条件句。', tip:'试 Although…, I still believe…'},
    {criterion:'pronunciation', score:clamp(base), note:'回听录音，标出含糊词尾与不自然停顿。', tip:'跟读示范句，注意重音与意群。'},
  ];
  const overall = Math.round(criteria.reduce((s,c)=>s+c.score,0)/criteria.length*2)/2;
  return {
    overall,
    summary: overall>=7 ? '今天已触及 7 分区间：内容充分且出现精准搭配。' : '仍在 6.5 附近。关键：更长连贯输出 + 自然使用精准搭配。',
    criteria,
    upgrades:['刻意练习 20–30 秒连续输出。','每个答案嵌入 1 个今日搭配。', missed[0]?`下次优先练：${missed[0].phrase} — ${missed[0].example}`:'把已用搭配换场景再说一遍。'],
    collocationsUsed: used.map(u=>u.phrase),
    collocationsMissed: missed.map(m=>m.phrase),
    practiceNext: [...missed.slice(0,2), ...used.slice(0,1)].map(v=>v.phrase),
  };
}

async function startRec(){
  stopRecTracks();
  if (rec.url) URL.revokeObjectURL(rec.url);
  rec = {...rec, status:'idle', sec:0, url:null, chunks:[], media:null};
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==='undefined'){ rec.status='unsupported'; render(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    rec.stream = stream;
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : (MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':undefined);
    const media = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    rec.media = media; rec.chunks=[];
    media.ondataavailable = e => { if(e.data.size) rec.chunks.push(e.data); };
    media.onstop = () => {
      const blob = new Blob(rec.chunks, {type: media.mimeType||'audio/webm'});
      rec.url = URL.createObjectURL(blob);
      rec.status='stopped';
      stopRecTracks();
      render();
    };
    media.start(250);
    rec.status='recording'; rec.sec=0;
    clearInterval(rec.timer);
    rec.timer = setInterval(()=>{ rec.sec++; const el=document.getElementById('timer'); if(el) el.textContent=fmt(rec.sec); },1000);
    render();
  }catch{ rec.status='denied'; render(); }
}
function stopRec(){
  clearInterval(rec.timer);
  if (rec.media && rec.media.state!=='inactive') rec.media.stop();
  else { rec.status='stopped'; stopRecTracks(); render(); }
}
function stopRecTracks(){ rec.stream?.getTracks().forEach(t=>t.stop()); rec.stream=null; }
function resetRec(){ clearInterval(rec.timer); stopRecTracks(); if(rec.url) URL.revokeObjectURL(rec.url); rec={status:'idle',sec:0,url:null,media:null,chunks:[],timer:null,stream:null}; render(); }

function submitRecording(durationSec, audioUrl){
  const m = mock();
  const part = m.parts[partIndex];
  const focus = byId(part.focus);
  const phrases = noted.split(/[,，、\n]/).map(s=>s.trim()).filter(Boolean);
  state.recordings.push({id:'r'+Date.now(), date:todayKey(), mockId:m.id, partId:part.id, durationSec, note:noted||undefined});
  report = generateFeedback(durationSec, focus, phrases, part.label);
  state.lastFeedback = report; state.lastFeedbackDate = todayKey();
  upsertCheckIn({recorded:true, mockDone:true, feedbackSeen:true, overallScore:report.overall});
  if (!doneParts.includes(part.id)) doneParts.push(part.id);
  save(); render();
}

function practiceVocab(id, mastered){
  const cur = state.vocabProgress[id] || {id,reps:0,mastered:false};
  state.vocabProgress[id] = {...cur, reps:cur.reps+1, mastered: mastered!==undefined ? mastered : (cur.mastered || cur.reps+1>=5)};
  upsertCheckIn({vocabDrilled:true});
  save(); render();
}
function speak(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang='en-GB'; u.rate=0.92; speechSynthesis.speak(u);
}

  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  const app = document.getElementById('app');
  app.innerHTML = view==='today'?renderToday():view==='mock'?renderMock():view==='vocab'?renderVocab():renderProgress();
  bind();
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{ view=el.dataset.go; render(); }));
  document.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('click',()=>{
    partIndex=+el.dataset.part; prepLeft=null; clearInterval(prepTimer); noted=''; resetRec();
  }));
  document.querySelectorAll('[data-vfilter]').forEach(el=>el.addEventListener('click',()=>{ vocabFilter=el.dataset.vfilter; render(); }));
  document.querySelectorAll('[data-speak]').forEach(el=>el.addEventListener('click',()=>speak(decodeURIComponent(el.dataset.speak))));
  document.querySelectorAll('[data-practice]').forEach(el=>el.addEventListener('click',()=>practiceVocab(el.dataset.practice)));
  document.querySelectorAll('[data-master]').forEach(el=>el.addEventListener('click',()=>practiceVocab(el.dataset.master,true)));
  const notedEl = document.getElementById('noted');
  if (notedEl) notedEl.addEventListener('input', e => { noted = e.target.value; });
  document.getElementById('startPrep')?.addEventListener('click',()=>{
    prepLeft = mock().parts[partIndex].prep || 60;
    clearInterval(prepTimer);
    prepTimer = setInterval(()=>{ prepLeft--; if(prepLeft<=0){ clearInterval(prepTimer); prepLeft=null; } render(); },1000);
    render();
  });
  document.getElementById('startRec')?.addEventListener('click',()=>startRec());
  document.getElementById('stopRec')?.addEventListener('click',()=>stopRec());
  document.getElementById('resetRec')?.addEventListener('click',()=>resetRec());
  document.getElementById('submitRec')?.addEventListener('click',()=>submitRecording(rec.sec, rec.url));
  document.getElementById('skipRec')?.addEventListener('click',()=>submitRecording(Math.max(rec.sec,45), null));
  document.getElementById('nextPart')?.addEventListener('click',()=>{ partIndex++; prepLeft=null; noted=''; report=null; resetRec(); });
  document.getElementById('resetAll')?.addEventListener('click',()=>{
    if(confirm('确定清空本地打卡数据？')){ localStorage.removeItem(STORAGE_KEY); state=defaultState(); report=null; doneParts=[]; partIndex=0; render(); }
  });
}

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  view = btn.dataset.view;
  render();
});

render();
</script>
</body>
</html>
