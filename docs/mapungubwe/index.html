<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapungubwe｜教案与讲义</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2a2118;
      --muted: #6b5e50;
      --paper: #f6f1ea;
      --panel: #fffdf9;
      --line: #e0d5c8;
      --accent: #8b4518;
      --accent-soft: #f0e4d6;
      --warm: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "DM Sans", sans-serif; color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 8% 0%, #e8dcc8 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 95% 5%, #d9cfc0 0%, transparent 45%),
        var(--paper);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
    .brand { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(2rem,5vw,2.7rem); margin: 0 0 12px; line-height: 1.15; }
    .lead { color: var(--muted); margin: 0 0 28px; line-height: 1.55; max-width: 36em; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .meta span { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: .85rem; }
    .links { display: grid; gap: 14px; }
    a.card-link {
      display: block; text-decoration: none; color: inherit; background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px;
      transition: border-color .2s, transform .2s;
    }
    a.card-link:hover { border-color: var(--accent); transform: translateY(-2px); }
    a.card-link h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 1.3rem; margin: 0 0 8px; }
    a.card-link p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.5; }
    a.card-link .tag { display: inline-block; margin-top: 12px; font-size: .78rem; font-weight: 700; color: var(--warm); letter-spacing: .04em; text-transform: uppercase; }
    footer { margin-top: 36px; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="meta"><span>IELTS Reading</span><span>Test 2 · Passage 2</span></p>
    <h1 class="brand">Mapungubwe</h1>
    <p class="lead">网页版教案与讲义：同义词替换、做题技巧、重点搭配，以及原文关键句高亮。浏览器直接打开即可。</p>
    <div class="links">
      <a class="card-link" href="./passage.html">
        <h2>原文关键句 Highlight</h2>
        <p>全文 A–G 高亮定位句，标注题号与搭配；可按题型筛选。</p>
        <span class="tag">先看这篇</span>
      </a>
      <a class="card-link" href="./student.html">
        <h2>学生讲义（练习版）</h2>
        <p>同义词热身、搭配勾选、Q14–26 答题表。不含答案。</p>
        <span class="tag">发给学生</span>
      </a>
      <a class="card-link" href="./teacher.html">
        <h2>教师教案（含答案）</h2>
        <p>替换链、三类题型流程、搭配清单与参考答案。</p>
        <span class="tag">仅教师</span>
      </a>
    </div>
    <footer>打印时建议勾选「背景图形」以保留高亮色</footer>
  </main>
</body>
</html>
