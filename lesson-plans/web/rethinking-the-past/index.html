<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rethinking the Past｜教案与讲义</title>


<style>
    :root{--ink:#1a2332;--muted:#5a6578;--paper:#eef2f7;--panel:#fff;--line:#d5dde8;--accent:#1e4d7b;--warm:#b45309}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(ellipse 70% 45% at 5% 0%,#d9e4f2 0%,transparent 55%),var(--paper)}
    .wrap{max-width:720px;margin:0 auto;padding:48px 20px 64px}
    .brand{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(1.9rem,5vw,2.6rem);margin:0 0 12px;line-height:1.15}
    .lead{color:var(--muted);margin:0 0 26px;line-height:1.55;max-width:36em}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
    .meta span{background:#dce8f5;color:var(--accent);padding:4px 10px;border-radius:4px;font-weight:700;font-size:.85rem}
    .links{display:grid;gap:14px}
    a.card-link{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;transition:border-color .2s,transform .2s}
    a.card-link:hover{border-color:var(--accent);transform:translateY(-2px)}
    a.card-link h2{font-family:Georgia,"Songti SC","SimSun",serif;font-size:1.28rem;margin:0 0 8px}
    a.card-link p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5}
    a.card-link .tag{display:inline-block;margin-top:12px;font-size:.78rem;font-weight:700;color:var(--warm);letter-spacing:.04em;text-transform:uppercase}
    footer{margin-top:36px;font-size:.85rem;color:var(--muted)}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="meta"><span>IELTS Reading</span><span>Test 3 · Passage 3</span></p>
    <h1 class="brand">Rethinking the Past</h1>
    <p class="lead">网页版：同义词替换、做题技巧、重点搭配；教师精讲版已标注<strong>原文答案句与重点句</strong>。</p>
    <div class="links">
      <a class="card-link" href="./teacher.html">
        <h2>教师精讲（答案句标注）</h2>
        <p>全文绿标答案句、橙标重点句、蓝标搭配；逐题精讲卡 + 排除项。</p>
        <span class="tag">老师先看 · 更细致</span>
      </a>
      <a class="card-link" href="./passage.html">
        <h2>原文关键句 Highlight（课堂投影）</h2>
        <p>可按题型筛选高亮，适合一边讲一边定位。</p>
        <span class="tag">投影用</span>
      </a>
      <a class="card-link" href="./student.html">
        <h2>学生讲义（练习版）</h2>
        <p>热身、搭配、Q27–40 答题表。不含答案。</p>
        <span class="tag">发给学生</span>
      </a>
    </div>
    <footer>浏览器直接打开即可 · 打印勾选背景图形</footer>
  </main>
</body>
</html>
