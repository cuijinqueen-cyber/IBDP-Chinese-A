<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Speaking — Voice In → Auto Score</title>
<style>
:root {
  --ink: #1f1a17;
  --muted: #5c534c;
  --accent: #0f5c4c;
  --card: #fffdf9;
  --line: #ddd4c8;
  --danger: #9b2c2c;
  --rec: #b33b3b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif SC", serif;
  color: var(--ink);
  background:
    radial-gradient(circle at top left, #efe6d8, transparent 40%),
    linear-gradient(180deg, #f7f4ef, #f3eee6);
  line-height: 1.55;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 18px 64px; }
h1 { color: var(--accent); margin: 0 0 6px; font-size: 1.5rem; }
.sub { color: var(--muted); margin: 0 0 18px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
label { display: block; font-weight: 600; margin: 0 0 6px; color: var(--accent); }
input, select, textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font: inherit;
  background: #fff;
  color: var(--ink);
}
textarea { min-height: 120px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.voice-panel {
  text-align: center;
  padding: 22px 16px 18px;
  background: linear-gradient(180deg, #f7faf7, #fffdf9);
}
.status {
  min-height: 1.4em;
  color: var(--muted);
  margin: 0 0 14px;
  font-size: .98rem;
}
.status.hot { color: var(--rec); font-weight: 700; }
.mic-btn {
  width: 120px; height: 120px; border-radius: 50%;
  border: 0; cursor: pointer; color: #fff;
  background: var(--accent);
  font-size: 1rem; font-weight: 700;
  box-shadow: 0 10px 24px rgba(15,92,76,.25);
  transition: transform .15s ease, background .15s ease;
}
.mic-btn:hover { transform: scale(1.03); }
.mic-btn.recording {
  background: var(--rec);
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(179,59,59,.45); }
  70% { box-shadow: 0 0 0 18px rgba(179,59,59,0); }
  100% { box-shadow: 0 0 0 0 rgba(179,59,59,0); }
}
.timer { margin-top: 10px; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
.live {
  margin-top: 14px; text-align: left;
  background: #f4efe7; border-radius: 12px; padding: 12px;
  min-height: 64px; color: var(--ink);
}
.live .interim { color: var(--muted); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 8px; }
.check {
  display: flex; gap: 8px; align-items: flex-start;
  background: #f4efe7; border-radius: 10px; padding: 8px 10px; font-size: .95rem;
}
.check input { width: auto; margin-top: 3px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
button.action {
  border: 0; border-radius: 999px; padding: .65rem 1rem;
  background: var(--accent); color: #fff; font: inherit; cursor: pointer;
}
button.secondary { background: #4a4038; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
#result { white-space: pre-wrap; }
.scores {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0;
}
.score-box {
  background: #e9efe9; border-radius: 12px; padding: 10px; text-align: center;
}
.score-box b { display: block; font-size: 1.35rem; color: var(--accent); }
.muted { color: var(--muted); font-size: .92rem; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }
audio { width: 100%; margin-top: 10px; }
.warn {
  background: #f8ebe3; color: var(--warn, #8a4b2d);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: .92rem;
}
@media (max-width: 720px) {
  .row, .checks, .scores { grid-template-columns: 1fr; }
  .mic-btn { width: 108px; height: 108px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Voice in → Auto score</h1>
  <p class="sub">点击麦克风开始说；说完自动停止转写并立刻打分 + Top 3 建议。</p>

  <div id="compat" class="warn" style="display:none"></div>

  <div class="card">
    <div class="row">
      <div>
        <label for="part">Task type</label>
        <select id="part">
          <option value="part1">Part 1</option>
          <option value="part2">Part 2</option>
          <option value="part3" selected>Part 3</option>
        </select>
      </div>
      <div>
        <label for="lang">Speech language</label>
        <select id="lang">
          <option value="en-US" selected>English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="en-AU">English (AU)</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px">
      <label for="question">Question / cue card</label>
      <input id="question" placeholder="e.g. Has technology improved education?">
    </div>
  </div>

  <div class="card voice-panel">
    <p class="status" id="status">Ready — click the mic and speak</p>
    <button type="button" class="mic-btn" id="micBtn" aria-label="Start speaking">Speak</button>
    <div class="timer" id="timer">00:00</div>
    <div class="live" id="live"><span class="muted">Live transcript will appear here…</span></div>
    <audio id="player" controls style="display:none"></audio>
    <p class="muted" style="margin-top:10px">Auto-score turns on when you stop. Chrome / Edge recommended.</p>
  </div>

  <div class="card">
    <label for="transcript">Transcript (editable if recognition misses words)</label>
    <textarea id="transcript" placeholder="Filled automatically from voice input…"></textarea>
    <details>
      <summary>Optional: tick extra issues you heard</summary>
      <div class="checks" id="issues"></div>
    </details>
  </div>

  <div class="btns">
    <button type="button" class="action" id="scoreBtn">Score now</button>
    <button type="button" class="action secondary" id="promptBtn">Copy AI prompt</button>
    <button type="button" class="action ghost" id="clearBtn">Clear</button>
    <a class="action ghost" href="index.html" style="text-decoration:none;display:inline-block">Back to plan</a>
  </div>

  <div class="card" id="outputCard" style="display:none; margin-top:14px">
    <label>Result</label>
    <div class="scores" id="scoreBoxes"></div>
    <div id="result"></div>
  </div>
</div>

<script>
const ISSUE_DEFS = [
  { id: 'short', label: 'Answer too short / under-developed', cat: 'fc', weight: 1.0 },
  { id: 'pause', label: 'Long silent pauses / frequent hesitation', cat: 'fc', weight: 0.8 },
  { id: 'structure', label: 'Weak structure (no clear reason/example)', cat: 'fc', weight: 0.8 },
  { id: 'memorised', label: 'Sounds memorised / unnatural script', cat: 'fc', weight: 0.5 },
  { id: 'repeat', label: 'Repeats nice/good/interesting or limited vocab', cat: 'lr', weight: 0.9 },
  { id: 'paraphrase', label: 'Cannot paraphrase / topic words missing', cat: 'lr', weight: 0.8 },
  { id: 'awkward', label: 'Awkward word choice / L1 translation', cat: 'lr', weight: 0.6 },
  { id: 'basicGrammar', label: 'Basic grammar errors (agree, there is/are, very like)', cat: 'gra', weight: 1.0 },
  { id: 'tense', label: 'Tense / agreement slips', cat: 'gra', weight: 0.7 },
  { id: 'noComplex', label: 'Almost no complex sentences', cat: 'gra', weight: 0.6 },
  { id: 'unclear', label: 'Listener strain / mumbled / too fast', cat: 'pron', weight: 0.9 },
  { id: 'endings', label: 'Word endings cut off (asked/changed)', cat: 'pron', weight: 0.6 },
  { id: 'flat', label: 'Flat stress / intonation', cat: 'pron', weight: 0.5 },
];

const SUGGESTIONS = {
  short: {
    issue: 'Answer too short',
    why: 'Limits Fluency & Coherence and Task development.',
    better: 'Use a 3-beat answer: direct view → reason → example. Aim for 3–4 sentences (Part 1) or 40–60 seconds (Part 3).'
  },
  pause: {
    issue: 'Long pauses',
    why: 'Creates strain and lowers Fluency.',
    better: 'Use a repair phrase: “What I mean is…” / “Let me think for a second…” then continue.'
  },
  structure: {
    issue: 'Weak structure',
    why: 'Ideas feel listed, not developed.',
    better: 'For Part 3 use IDEA: Insight → Detail → Example → Alternative.'
  },
  memorised: {
    issue: 'Memorised delivery',
    why: 'Sounds unnatural and risks losing coherence if interrupted.',
    better: 'Speak from 4 bullet notes only; change one personal detail each time.'
  },
  repeat: {
    issue: 'Limited vocabulary',
    why: 'Repeating nice/good caps Lexical Resource around 6.0–6.5.',
    better: 'Replace weak adjectives with precise ones (rewarding, flexible, monotonous, well-connected).'
  },
  paraphrase: {
    issue: 'Weak paraphrase / missing topic lexis',
    why: 'Hard to show flexibility under Part 3 pressure.',
    better: 'Pre-load 6 collocations before the topic (e.g. digital distraction, career prospects).'
  },
  awkward: {
    issue: 'Awkward wording',
    why: 'Word choice sounds translated and less natural.',
    better: 'Prefer short natural chunks: “It depends on…” / “A key reason is…”'
  },
  basicGrammar: {
    issue: 'Basic grammar errors',
    why: 'Frequent slips stop GRA from reaching 7.',
    better: 'Fix high-frequency forms: really like; there is/are; it depends; I agree.'
  },
  tense: {
    issue: 'Tense/agreement slips',
    why: 'Especially costly in Part 2 stories.',
    better: 'Slow the story spine and mark past forms before speaking.'
  },
  noComplex: {
    issue: 'No complex sentences',
    why: 'Range looks limited even if accurate.',
    better: 'Add one because/if/although sentence in every longer answer.'
  },
  unclear: {
    issue: 'Clarity problems',
    why: 'Pronunciation strain lowers communicative quality.',
    better: 'Slow 10% and speak in sense groups; prioritise clarity over speed.'
  },
  endings: {
    issue: 'Missing word endings',
    why: 'Past forms and plurals become unclear.',
    better: 'Over-articulate endings in the re-record: asked, changed, friends.'
  },
  flat: {
    issue: 'Flat intonation',
    why: 'Meaning and emphasis are harder to follow.',
    better: 'Stress content words and use a falling tone at the end of each idea.'
  }
};

const issueBox = document.getElementById('issues');
ISSUE_DEFS.forEach(item => {
  const div = document.createElement('label');
  div.className = 'check';
  div.innerHTML = `<input type="checkbox" value="${item.id}" data-cat="${item.cat}" data-weight="${item.weight}"> <span>${item.label}</span>`;
  issueBox.appendChild(div);
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const liveEl = document.getElementById('live');
const transcriptEl = document.getElementById('transcript');
const timerEl = document.getElementById('timer');
const player = document.getElementById('player');
const compat = document.getElementById('compat');

let recognition = null;
let recognizing = false;
let finalTranscript = '';
let autoScoreOnEnd = true;
let startedAt = 0;
let timerId = null;
let mediaRecorder = null;
let mediaStream = null;
let audioChunks = [];
let silenceWatch = null;
let lastSpeechAt = 0;

if (!SpeechRecognition) {
  compat.style.display = 'block';
  compat.textContent = 'This browser has no Web Speech API. Please use Chrome or Edge for voice input. You can still paste a transcript and click Score now.';
  micBtn.disabled = true;
  micBtn.style.opacity = .5;
}

function setStatus(text, hot = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('hot', hot);
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

function startTimer() {
  startedAt = Date.now();
  timerEl.textContent = '00:00';
  clearInterval(timerId);
  timerId = setInterval(() => {
    timerEl.textContent = formatTime(Date.now() - startedAt);
  }, 250);
}

function stopTimer() {
  clearInterval(timerId);
  timerId = null;
}

function selectedIssues() {
  return [...document.querySelectorAll('#issues input:checked')].map(el => el.value);
}

function roundHalf(n) { return Math.round(n * 2) / 2; }
function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

function estimateScores(part, issues, transcript) {
  const base = { fc: 7.0, lr: 7.0, gra: 7.0, pron: 7.0 };
  const weights = { fc: 0, lr: 0, gra: 0, pron: 0 };
  const issueSet = [...issues];

  ISSUE_DEFS.forEach(def => {
    if (issueSet.includes(def.id)) weights[def.cat] += def.weight;
  });

  const words = (transcript || '').trim().split(/\s+/).filter(Boolean).length;
  const durationSec = startedAt ? Math.max(1, Math.round((Date.now() - startedAt) / 1000)) : 0;

  if (part === 'part1' && words > 0 && words < 25) {
    weights.fc += 0.8;
    if (!issueSet.includes('short')) issueSet.push('short');
  }
  if (part === 'part3' && words > 0 && words < 45) {
    weights.fc += 1.0;
    if (!issueSet.includes('short')) issueSet.push('short');
  }
  if (part === 'part2' && words > 0 && words < 120) {
    weights.fc += 0.8;
    if (!issueSet.includes('short')) issueSet.push('short');
  }

  // speaking-rate / pause heuristic from recording length vs words
  if (durationSec >= 8 && words > 0) {
    const wpm = (words / durationSec) * 60;
    if (wpm < 70) {
      weights.fc += 0.5;
      weights.pron += 0.2;
      if (!issueSet.includes('pause')) issueSet.push('pause');
    }
    if (wpm > 190) {
      weights.pron += 0.5;
      if (!issueSet.includes('unclear')) issueSet.push('unclear');
    }
  }

  const lower = (transcript || '').toLowerCase();
  const grammarCues = [
    /i very like/, /in my [a-z ]+ have/, /it depend\b/, /i am agree/, /there have/,
    /\bhe don't\b/, /\bshe don't\b/
  ];
  if (grammarCues.some(r => r.test(lower))) {
    weights.gra += 0.8;
    if (!issueSet.includes('basicGrammar')) issueSet.push('basicGrammar');
  }
  if (/\b(nice|good|interesting)\b/.test(lower)) {
    const count = (lower.match(/\b(nice|good|interesting)\b/g) || []).length;
    if (count >= 2) {
      weights.lr += 0.6;
      if (!issueSet.includes('repeat')) issueSet.push('repeat');
    }
  }
  if (!/\b(because|if|although|while|which|that)\b/.test(lower) && words > 40) {
    weights.gra += 0.4;
    if (!issueSet.includes('noComplex')) issueSet.push('noComplex');
  }

  const scores = {};
  for (const k of Object.keys(base)) {
    const penalty = Math.min(1.8, weights[k] * 0.55);
    scores[k] = roundHalf(clamp(base[k] - penalty, 5.5, 8.0));
  }
  const overall = roundHalf(clamp((scores.fc + scores.lr + scores.gra + scores.pron) / 4, 5.5, 8.0));
  return { scores, overall, issues: [...new Set(issueSet)], words, durationSec };
}

function topSuggestions(issues) {
  const order = ['short','structure','pause','basicGrammar','tense','repeat','paraphrase','noComplex','unclear','endings','flat','awkward','memorised'];
  const picked = [];
  for (const id of order) {
    if (issues.includes(id) && SUGGESTIONS[id]) picked.push(SUGGESTIONS[id]);
    if (picked.length === 3) break;
  }
  while (picked.length < 3) {
    picked.push({
      issue: 'Push toward Band 7 development',
      why: 'Even solid answers need clearer extension for 7.0–7.5.',
      better: 'Add one precise example and one complex sentence (because/if/although).'
    });
  }
  return picked.slice(0, 3);
}

function partTip(part) {
  if (part === 'part1') return 'Part 1 focus: 2–4 sentences; answer → reason → example.';
  if (part === 'part2') return 'Part 2 focus: cover all bullets; speak 1:40–2:00; end with reflection.';
  return 'Part 3 focus: IDEA frame; 40–60 seconds; opinion + why + example.';
}

function renderResult({ fromVoice = false } = {}) {
  const part = document.getElementById('part').value;
  const question = document.getElementById('question').value.trim() || '(no question provided)';
  const transcript = transcriptEl.value.trim();
  const issues = selectedIssues();
  if (!transcript) {
    setStatus('No transcript yet — speak first or paste text.');
    return;
  }

  const { scores, overall, issues: finalIssues, words, durationSec } = estimateScores(part, issues, transcript);
  const tips = topSuggestions(finalIssues);

  document.getElementById('scoreBoxes').innerHTML = `
    <div class="score-box"><span>FC</span><b>${scores.fc}</b></div>
    <div class="score-box"><span>LR</span><b>${scores.lr}</b></div>
    <div class="score-box"><span>GRA</span><b>${scores.gra}</b></div>
    <div class="score-box"><span>Pron</span><b>${scores.pron}</b></div>
    <div class="score-box"><span>Overall</span><b>${overall}</b></div>
  `;

  let text = '';
  text += `Mode: ${fromVoice ? 'Voice input (auto-scored)' : 'Manual score'}\n`;
  text += `Task: ${part.toUpperCase()}\nQuestion: ${question}\n`;
  text += `Length: ${words} words` + (durationSec ? ` · ~${durationSec}s` : '') + `\n\n`;
  text += `Estimated overall: ${overall}\n`;
  text += `FC ${scores.fc} | LR ${scores.lr} | GRA ${scores.gra} | Pron ${scores.pron}\n`;
  text += `Note: Pronunciation is estimated from delivery cues + transcript; verify with the audio playback.\n\n`;
  text += `${partTip(part)}\n\n`;
  text += `Top 3 suggestions:\n`;
  tips.forEach((t, i) => {
    text += `${i + 1}) ${t.issue}\n`;
    text += `   Why: ${t.why}\n`;
    text += `   Try: ${t.better}\n\n`;
  });
  text += `Next step: Re-speak the SAME question focusing only on suggestion #1.`;

  document.getElementById('result').textContent = text;
  document.getElementById('outputCard').style.display = 'block';
  setStatus(`Scored · Overall ${overall}`);
}

async function startAudioCapture() {
  audioChunks = [];
  player.style.display = 'none';
  player.removeAttribute('src');
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(mediaStream);
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      if (!audioChunks.length) return;
      const blob = new Blob(audioChunks, { type: audioChunks[0].type || 'audio/webm' });
      player.src = URL.createObjectURL(blob);
      player.style.display = 'block';
    };
    mediaRecorder.start();
  } catch (err) {
    console.warn(err);
    setStatus('Microphone permission needed for recording playback (speech recognition may still work).');
  }
}

function stopAudioCapture() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch (_) {}
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

function setupRecognition() {
  recognition = new SpeechRecognition();
  recognition.lang = document.getElementById('lang').value;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing = true;
    micBtn.classList.add('recording');
    micBtn.textContent = 'Stop';
    setStatus('Listening… speak now', true);
    liveEl.innerHTML = '<span class="muted">Listening…</span>';
  };

  recognition.onresult = (event) => {
    lastSpeechAt = Date.now();
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const piece = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += piece + ' ';
      else interim += piece;
    }
    const cleanFinal = finalTranscript.replace(/\s+/g, ' ').trim();
    liveEl.innerHTML = `${cleanFinal}${interim ? ` <span class="interim">${interim}</span>` : ''}` || '<span class="muted">Listening…</span>';
    transcriptEl.value = `${cleanFinal}${interim ? ' ' + interim : ''}`.trim();
  };

  recognition.onerror = (event) => {
    console.warn('speech error', event.error);
    if (event.error === 'not-allowed') {
      setStatus('Microphone blocked. Allow mic access and try again.');
    } else if (event.error !== 'aborted') {
      setStatus(`Speech error: ${event.error}`);
    }
  };

  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = 'Speak';
    stopTimer();
    stopAudioCapture();
    clearInterval(silenceWatch);
    const text = transcriptEl.value.trim() || finalTranscript.trim();
    transcriptEl.value = text;
    if (text && autoScoreOnEnd) {
      setStatus('Speech ended — scoring…');
      renderResult({ fromVoice: true });
    } else if (!text) {
      setStatus('No speech captured. Try again in Chrome/Edge.');
    } else {
      setStatus('Stopped');
    }
  };
}

async function startSpeaking() {
  if (!SpeechRecognition) return;
  finalTranscript = '';
  transcriptEl.value = '';
  document.getElementById('outputCard').style.display = 'none';
  autoScoreOnEnd = true;
  lastSpeechAt = Date.now();
  setupRecognition();
  recognition.lang = document.getElementById('lang').value;
  await startAudioCapture();
  startTimer();
  try {
    recognition.start();
  } catch (err) {
    setStatus('Could not start recognition. Refresh and allow microphone.');
    return;
  }

  // Auto-stop after ~2.2s of silence (useful for Part 1/3). Part 2 users can press Stop.
  clearInterval(silenceWatch);
  silenceWatch = setInterval(() => {
    if (!recognizing) return;
    const part = document.getElementById('part').value;
    const silenceLimit = part === 'part2' ? 5000 : 2200;
    if (Date.now() - lastSpeechAt > silenceLimit && (transcriptEl.value.trim() || finalTranscript.trim())) {
      stopSpeaking();
    }
  }, 300);
}

function stopSpeaking() {
  autoScoreOnEnd = true;
  clearInterval(silenceWatch);
  if (recognition && recognizing) {
    try { recognition.stop(); } catch (_) {}
  } else {
    stopTimer();
    stopAudioCapture();
    micBtn.classList.remove('recording');
    micBtn.textContent = 'Speak';
    if (transcriptEl.value.trim()) renderResult({ fromVoice: true });
  }
}

micBtn.addEventListener('click', () => {
  if (recognizing) stopSpeaking();
  else startSpeaking();
});

document.getElementById('scoreBtn').addEventListener('click', () => renderResult({ fromVoice: false }));
document.getElementById('promptBtn').addEventListener('click', async () => {
  const partLabel = { part1: 'Part 1', part2: 'Part 2', part3: 'Part 3' }[document.getElementById('part').value];
  const question = document.getElementById('question').value.trim() || '[question]';
  const transcript = transcriptEl.value.trim() || '[transcript]';
  const prompt = `You are an IELTS Speaking examiner-coach.
Student target: Band 7.0–7.5 (current level around 6.5).

Task type: ${partLabel}
Question: ${question}
Student answer (from voice transcript):
"""
${transcript}
"""
